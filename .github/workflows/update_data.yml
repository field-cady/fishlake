name: Monthly Data Update

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml

    - name: Run Scrapers
      run: |
        # Don't let one flaky state endpoint abort the whole monthly update.
        # scrape_all.py writes each state's file independently and only
        # overwrites on success, so failed states keep last month's data.
        python scrape_all.py || echo "::warning::one or more state scrapers failed; merging available data"
        # merge_data.py also backfills missing elevations from a DEM
        # (Open-Elevation), using data/elevation_cache.json so only lakes new
        # since last month are looked up. The cache is committed below.
        python merge_data.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Check if there are any changes to commit
        if [[ -n $(git status --porcelain) ]]; then
          git add -A data/
          git commit -m "Automated monthly data update ($(date +'%Y-%m-%d'))"
          git push
        else
          echo "No changes detected in data. Skipping commit."
        fi